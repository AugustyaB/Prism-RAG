<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RAG Intelligence UI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=3" />
</head>
<body>
  <!-- Ambient Background Glows -->
  <div class="ambient-glow top-left"></div>
  <div class="ambient-glow bottom-right"></div>

  <main class="app-container glass-panel">
    
    <!-- Sidebar: Uploads & Config -->
    <aside class="sidebar">
      <header class="app-header">
        <h1>RAG Pipeline</h1>
        <p class="subtitle">Secure Document Intelligence</p>
      </header>
      
      <section class="upload-section">
        <h3>Knowledge Base</h3>
        <div class="upload-area" id="drop-zone">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
            <polyline points="17 8 12 3 7 8"></polyline>
            <line x1="12" y1="3" x2="12" y2="15"></line>
          </svg>
          <p>Drag & drop PDF here</p>
          <span class="text-sm text-dim">or click to browse</span>
          <input type="file" id="file-input" accept=".pdf" hidden />
        </div>
        <div id="upload-status" class="status-msg"></div>
      </section>

      <section class="config-section">
        <h3>Model Engine</h3>
        <div class="toggle-container">
          <label class="toggle-btn active" data-provider="lmstudio">
            <input type="radio" name="llm_provider" value="lmstudio" checked hidden />
            GPT-OSS (Local)
          </label>
          <label class="toggle-btn" data-provider="gemini">
            <input type="radio" name="llm_provider" value="gemini" hidden />
            Gemini (Cloud)
          </label>
        </div>
      </section>
    </aside>

    <!-- Main Chat Workspace -->
    <section class="chat-workspace">
      <div class="chat-history" id="chat-history">
        <!-- Empty state placeholder -->
        <div class="empty-state">
          <div class="icon-pulse">
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
          </div>
          <h2>Ready to analyze</h2>
          <p>Upload a document and ask questions to begin.</p>
        </div>
      </div>

      <div class="chat-input-area">
        <form id="query-form" class="input-wrapper glass-panel">
          <input type="text" id="query-input" placeholder="Ask about your documents..." autocomplete="off" />
          <button type="submit" id="send-btn" aria-label="Send">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="22" y1="2" x2="11" y2="13"></line>
              <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
            </svg>
          </button>
        </form>
      </div>
    </section>

  </main>
  
  <!-- Single script entry -->
  <script src="script.js"></script>
</body>
</html>
